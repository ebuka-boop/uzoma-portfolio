<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080816"><title>Uzoma Ebuka — Email Designer & Design Lead</title><style>html,body{margin:0;min-height:100%;background:#080816;color:#fff;font-family:Arial,sans-serif}#boot{position:fixed;inset:0;display:grid;place-items:center;background:#c9ff18;color:#080816;font-size:12px;font-weight:800;letter-spacing:.12em}#err{max-width:640px;padding:32px;line-height:1.6}</style></head><body><div id="boot">LOADING PORTFOLIO…</div><script>(async()=>{try{const base='https://raw.githubusercontent.com/ebuka-boop/uzoma-portfolio/deploy-assets/';const parts=['chunk-001.txt','chunk-002.txt','chunk-003.txt','chunk-004.txt','chunk-005.txt','chunk-006.txt','chunk-007.txt','chunk-008a.txt','chunk-008b.txt','chunk-009.txt','chunk-010a.txt','chunk-010b.txt','chunk-011.txt','chunk-012.txt','chunk-013.txt','chunk-014.txt','chunk-015.txt'];const files=[...parts.map(x=>'deploy-chunks/'+x),'resume.html'];const data=await Promise.all(files.map(f=>fetch(base+f+'?v=20260906b',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status+' '+f);return r.text()})));let html=data.slice(0,parts.length).join('');const resume='data:text/html;charset=utf-8,'+encodeURIComponent(data[parts.length]);html=html.replaceAll('href="resume.html"','href="'+resume+'"');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div id="err"><strong>Portfolio failed to load.</strong><br>'+String(e)+'</div>'}})();</script></body></html>
