name: Update portfolio accent

on:
  push:
    paths:
      - '.github/workflows/update-accent.yml'

permissions:
  contents: write

jobs:
  update-accent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace lime accent with #F2AE25
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('#c9ff18', '#F2AE25')
          s = s.replace('rgba(201,255,24', 'rgba(242,174,37')
          p.write_text(s)
          PY
      - name: Commit updated accent
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Update portfolio accent to F2AE25'
          git push
