name: Update portfolio copy

on:
  push:
    paths:
      - '.github/workflows/update-copy.yml'

permissions:
  contents: write

jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply requested website copy changes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          replacements = {
            'EARN CLICKS': 'EARNS CLICKS',
            'I rebuilt this section around the work itself: ten selected emails, shown large, sharp and legible. Hover a row to pause it. Click any design to open the full email at reading size.': 'Check out some of my previous designs. Click any design to open the full email at reading size.',
            'GOT A GOOD BRIEF? SEND THE INTERESTING ONES.': 'LET ME HELP YOU LIGHTEN THE DESIGN LOAD',
            '<div class="cta-copy"><p>Freelance project, agency collaboration or a full-time seat — if the work involves making email look sharper and work harder, I’m interested.</p><div class="cta-actions"><a class="pill primary" href="Uzoma_Ebuka_Resume.pdf" target="_blank">VIEW RESUME ↗</a><a class="pill" href="#top">BACK TO TOP ↑</a></div></div>': '<div class="cta-copy"><div class="cta-actions"><a class="pill primary" href="mailto:exxeldesigns@gmail.com">GET STARTED</a></div></div>',
            '.hero-word{font-size:clamp(92px,14.2vw,250px);': '.hero-word{font-size:clamp(78px,11.6vw,205px);',
            '.hero-word{font-size:clamp(76px,18vw,150px)}': '.hero-word{font-size:clamp(64px,15.5vw,128px)}',
            '.hero-word{font-size:19vw}': '.hero-word{font-size:16vw}'
          }

          for old, new in replacements.items():
            if old not in s:
              print(f'WARNING: target not found: {old[:80]}')
            s = s.replace(old, new)

          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Update portfolio copy and hero sizing'
          git push
