name: Remove resume button

on:
  push:
    paths:
      - '.github/workflows/remove-resume.yml'

permissions:
  contents: write

jobs:
  remove-resume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove hero resume button
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '<a class="pill" href="Uzoma_Ebuka_Resume.pdf" target="_blank">DOWNLOAD RESUME ↗</a>'
          if old not in s:
              raise SystemExit('Download Resume button target not found')
          s = s.replace(old, '')
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Remove Download Resume button'
          git push
